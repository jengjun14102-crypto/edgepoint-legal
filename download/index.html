<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b1210">
<title>Download EdgePoint Tennis Community</title>
<link rel="icon" href="/assets/icon.png">
<!-- Redirect landing page (đại ca 26/09): a Play Store link tapped inside the
     Facebook in-app browser renders BLACK. This normal HTML page renders fine in
     that webview, then hands off to Google Play (JS first, meta-refresh + a big
     manual button as fallbacks for locked-down in-app browsers). -->
<meta http-equiv="refresh" content="1;url=https://play.google.com/store/apps/details?id=com.edgepoint.community">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    background:radial-gradient(900px 420px at 50% -10%,rgba(61,220,151,.16),transparent 60%),linear-gradient(180deg,#0f1a16,#0b1210);
    color:#eaf3ef;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;-webkit-font-smoothing:antialiased}
  .card{max-width:420px;width:100%}
  img.logo{width:88px;height:88px;border-radius:22px;margin:0 auto 22px;box-shadow:0 14px 40px rgba(0,0,0,.4)}
  h1{font-size:1.5rem;line-height:1.2;letter-spacing:-.02em;margin-bottom:10px}
  p{color:#9fb3aa;font-size:1rem;line-height:1.6;margin-bottom:26px}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:54px;width:100%;
    padding:0 22px;border-radius:999px;font-weight:800;font-size:1.05rem;background:#3ddc97;color:#07130e;text-decoration:none}
  .btn:active{transform:translateY(1px)}
  .alt{margin-top:16px;font-size:.9rem}
  .alt a{color:#77f0ba;text-decoration:none;font-weight:700}
  .spin{margin:22px auto 0;width:22px;height:22px;border:3px solid rgba(61,220,151,.25);border-top-color:#3ddc97;border-radius:50%;animation:s 1s linear infinite}
  @keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
  <div class="card">
    <img class="logo" src="/assets/icon.png" alt="EdgePoint logo">
    <h1>Opening Google Play…</h1>
    <p>Getting EdgePoint Tennis Community for you. If it doesn't open automatically, tap the button below.</p>
    <a class="btn" id="go" href="https://play.google.com/store/apps/details?id=com.edgepoint.community" rel="noopener">Open in Google Play</a>
    <div class="spin" aria-hidden="true"></div>
    <p class="alt" style="margin-top:20px">Or search <strong>“EdgePoint Tennis Community”</strong> on Google Play.</p>
  </div>
<script>
  (function(){
    var play = 'https://play.google.com/store/apps/details?id=com.edgepoint.community';
    // Hand off to Google Play right away. Wrapped in try so a locked-down in-app
    // browser still shows the manual button + meta-refresh fallback.
    try { window.location.replace(play); } catch (e) {
      try { window.location.href = play; } catch (e2) {}
    }
  })();
</script>
</body>
</html>
