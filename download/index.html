<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b1210">
<title>Download EdgePoint Tennis Community</title>
<link rel="icon" href="/assets/icon.png">
<!-- Landing page for the Facebook CTA (đại ca 26/09). A raw play.google.com link
     tapped INSIDE the Facebook in-app browser renders BLACK. Fix: a normal HTML
     page (renders fine in that webview) with a USER-TAPPED button — no auto-redirect
     (auto-loading the Store URL would reproduce the black before the user can act,
     advisor 1/10). The button uses an Android `intent://` that hands off to the
     Google Play APP (shows "Open" if installed, "Install" if not) with an https
     Play Store fallback for any other browser. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    background:radial-gradient(900px 420px at 50% -10%,rgba(61,220,151,.16),transparent 60%),linear-gradient(180deg,#0f1a16,#0b1210);
    color:#eaf3ef;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;-webkit-font-smoothing:antialiased}
  .card{max-width:420px;width:100%}
  img.logo{width:92px;height:92px;border-radius:22px;margin:0 auto 22px;box-shadow:0 14px 40px rgba(0,0,0,.4)}
  h1{font-size:1.55rem;line-height:1.2;letter-spacing:-.02em;margin-bottom:10px}
  p{color:#9fb3aa;font-size:1rem;line-height:1.6;margin-bottom:26px}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:56px;width:100%;
    padding:0 22px;border-radius:999px;font-weight:800;font-size:1.08rem;background:#3ddc97;color:#07130e;text-decoration:none}
  .btn:active{transform:translateY(1px)}
  .alt{margin-top:18px;font-size:.92rem;color:#9fb3aa}
  .alt a{color:#77f0ba;text-decoration:none;font-weight:700}
</style>
</head>
<body>
  <div class="card">
    <img class="logo" src="/assets/icon.png" alt="EdgePoint logo">
    <h1>EdgePoint Tennis Community</h1>
    <p>Predict real ATP matches, build your accuracy record and climb the leaderboard. Free on Android.</p>
    <a class="btn" id="go" href="https://play.google.com/store/apps/details?id=com.edgepoint.community" rel="noopener">Open EdgePoint</a>
    <p class="alt">Installed? This opens the app. Not yet? It takes you to Google Play.</p>
  </div>
<script>
  // ONE smart button (đại ca 26/09 — "installed → open app, not installed → store").
  // Verified on Pixel: the app registers the `edgepoint://` scheme → opens its real
  // MainActivity (home), NOT the Facebook SDK's black CustomTabActivity, and NOT a
  // play.google.com page inside the FB webview. So on tap we try `edgepoint://`; if
  // the app opens, the page is hidden and we cancel; if nothing happens within 1.2s
  // (app not installed), we go to Google Play. Href stays = Play Store as the no-JS
  // fallback. User-gesture only.
  var STORE = 'https://play.google.com/store/apps/details?id=com.edgepoint.community';
  var go = document.getElementById('go');
  go.setAttribute('href', STORE);
  go.addEventListener('click', function (e) {
    if (!/Android/i.test(navigator.userAgent || '')) return; // non-Android: plain Play Store link
    e.preventDefault();
    var timer = setTimeout(function () { window.location.href = STORE; }, 1200);
    var cancel = function () { clearTimeout(timer); };
    document.addEventListener('visibilitychange', function () { if (document.hidden) cancel(); });
    window.addEventListener('pagehide', cancel);
    window.addEventListener('blur', cancel);
    try { window.location.href = 'edgepoint://'; } catch (err) { cancel(); window.location.href = STORE; }
  });
</script>
</body>
</html>
